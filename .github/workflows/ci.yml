name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-github-automation:
    name: Validate GitHub automation
    uses: DevOpsDerek/workflows/.github/workflows/validate-agentic-workflows.yml@dac4b81c298cb3ea6821ea312efa5375f42d5ccb
    with:
      gh-aw-version: v0.89.21
      workflows-directory: .github/workflows
    permissions:
      contents: read

  # ── Job 1: Formatting ────────────────────────────────────────────────────────
  format:
    name: Formatting (rustfmt)
    uses: DevOpsDerek/workflows/.github/workflows/lint-rust.yml@5ecebff22598835cbf5ccd7bfa07c036cce22ee9
    with:
      rust-version: "1.75.0"
      working-directory: .
    permissions:
      contents: read

  # ── Job 2: Clippy ────────────────────────────────────────────────────────────
  lint:
    name: Lint (clippy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stable Rust with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Job 3: Build & Test matrix ───────────────────────────────────────────────
  test:
    name: Test (Rust ${{ matrix.rust }} / ${{ matrix.os }})
    needs: [format, lint]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.75"]   # stable + minimum supported version (edition 2021 = 1.56+)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --verbose
